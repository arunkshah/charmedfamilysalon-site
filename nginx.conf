server {
    listen 80 default_server;
    server_name charmedfamilysalon.com www.charmedfamilysalon.com;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Behind Traefik (TLS terminated upstream): keep redirect Location headers
    # relative so they resolve on the current https origin, not http.
    absolute_redirect off;
    port_in_redirect off;

    # ── Block AI bots / crawlers (mirrors .htaccess) ──
    if ($http_user_agent ~* "(GPTBot|ChatGPT-User|ClaudeBot|Google-Extended|Applebot-Extended|CCBot|PerplexityBot|cohere-ai|Omgilibot|Diffbot|Bytespider|ImagesiftBot|Amazonbot|FacebookBot)") {
        return 403;
    }

    # ── Canonical host: www → non-www ──
    if ($host = www.charmedfamilysalon.com) {
        return 301 https://charmedfamilysalon.com$request_uri;
    }

    # ── Drop old/junk query variants from crawlers/plugins ──
    if ($args ~* "(^|&)amp=1(&|$)") {
        return 301 https://charmedfamilysalon.com$uri;
    }
    if ($args ~* "(^|&)wc-ajax=") {
        return 301 https://charmedfamilysalon.com$uri;
    }

    # ── /index.html → / (single canonical homepage) ──
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 https://charmedfamilysalon.com/;
    }

    # ── Origin fingerprint (lets us confirm traffic is served by the VPS) ──
    add_header X-Served-By "vps-charmed" always;

    # ── Security headers (applied via inheritance; asset blocks below use only `expires`) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml application/rss+xml application/xhtml+xml image/svg+xml font/ttf font/otf;

    # ── Pretty-URL redirects (mirrors .htaccess) ──
    location = /services { return 301 /services.html; }
    location = /about    { return 301 /about.html; }
    location = /gallery  { return 301 /gallery.html; }
    location = /contact  { return 301 /contact.html; }

    # Old/spam item URLs are not part of the salon site. Return 410 so
    # search engines drop them faster than ordinary soft-discovered 404s.
    location = /items { return 410; }
    location ^~ /items/ { return 410; }
    location = /contents { return 410; }
    location ^~ /contents/ { return 410; }
    location = /author { return 410; }
    location ^~ /author/ { return 410; }

    # ── Browser caching (using `expires` so security headers stay inherited) ──
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:css|js)$ {
        expires 30d;
    }
    location ~* \.(?:html|htm|xml)$ {
        expires 1h;
    }

    # ── Deny dotfiles / sensitive files (allow .well-known for ACME etc.) ──
    location ~ /\.(?!well-known) { deny all; }

    # ── Default: serve static files, real 404 otherwise ──
    location / {
        expires 1h;
        try_files $uri $uri/ =404;
    }
}
